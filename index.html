<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#e91d2d" />
  <meta name="description" content="Интерактивная инструкция по надеванию полумасок ВМ 6000 и ВМ 7500" />
  <title>Как надеть полумаску ВМ</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e91d2d'/%3E%3Cpath d='M14 24 32 15l18 9v16L32 53 14 40z' fill='white'/%3E%3Ccircle cx='32' cy='31' r='7' fill='%2320292e'/%3E%3C/svg%3E" />
  <style>
    :root{--red:#e91d2d;--ink:#151b1e;--muted:#667176;--paper:#fff;--soft:#f3f5f5;--ok:#0b8f60;--shadow:0 18px 45px rgba(19,28,33,.13)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:#e9edef;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit} .app{width:min(100%,520px);min-height:100vh;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.12)}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-2px;font-size:19px}.eyebrow{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;white-space:nowrap}.title{font-size:13px;font-weight:850;line-height:1.12;margin-top:2px;white-space:nowrap}
    main{padding:calc(14px + env(safe-area-inset-top)) 16px 94px}.progress-row{display:flex;align-items:center;gap:12px}.progress{height:7px;background:#e8ebec;border-radius:999px;overflow:hidden;flex:1}.progress>i{display:block;height:100%;width:11.111%;background:var(--red);border-radius:inherit;transition:width .45s cubic-bezier(.2,.8,.2,1)}.count{font-size:13px;font-weight:850;color:var(--muted);min-width:36px;text-align:right}
    .stage{height:min(42dvh,310px);min-height:245px;margin:12px 0 10px;border-radius:24px;background:radial-gradient(circle at 50% 35%,#fff 0 18%,#eef1f2 48%,#dfe5e7 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #dfe4e6}.stage.hidden{display:none}
    .photo-shell{position:absolute;inset:10px 12px 52px;display:grid;place-items:center}.photo-frame{position:relative;width:278px;height:226px;border-radius:22px;overflow:hidden;background:#d9ddde;border:3px solid #fff;box-shadow:0 12px 28px rgba(25,34,38,.24);transition:.25s}.photo-frame.animate{animation:photoPop .55s cubic-bezier(.2,.8,.2,1)}.step-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:opacity,transform}.scanline{position:absolute;left:0;right:0;height:52px;top:-60px;background:linear-gradient(to bottom,transparent,rgba(233,29,45,.18),transparent);animation:scan 2.4s ease-in-out infinite;pointer-events:none}.subcheck{position:absolute;right:10px;top:10px;background:var(--red);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;display:none}.subcheck.show{display:block}.test-tabs{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:none;gap:6px;padding:5px;background:rgba(255,255,255,.9);border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.16)}.test-tabs.show{display:flex}.test-tab{border:0;background:#e2e6e7;color:#4f5a5e;border-radius:999px;min-width:29px;height:29px;font-size:12px;font-weight:900;cursor:pointer}.test-tab.active{background:var(--red);color:#fff}
    .hint{position:absolute;left:14px;right:14px;bottom:12px;background:rgba(21,27,30,.88);color:#fff;padding:11px 14px;border-radius:14px;text-align:center;font-size:13px;font-weight:700;backdrop-filter:blur(8px)}
    @keyframes photoPop{from{opacity:.25;transform:scale(.93) translateY(8px)}to{opacity:1;transform:none}}@keyframes scan{0%,12%{transform:translateY(0);opacity:0}35%{opacity:1}75%,100%{transform:translateY(270px);opacity:0}}
    .step-card{min-height:170px;padding:18px;border-radius:22px;background:#fff;box-shadow:var(--shadow);border:1px solid #e8ebec}.step-card.slide-in{animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}.step-kicker{display:flex;align-items:center;gap:8px;color:var(--red);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.step-kicker b{display:grid;place-items:center;width:25px;height:25px;background:var(--red);color:#fff;border-radius:50%;font-size:12px}.step-card h1{font-size:23px;line-height:1.08;margin:10px 0 8px;letter-spacing:-.025em}.step-card p,.info-body{font-size:15px;line-height:1.42;color:#4d585d;margin:0}.tip{margin-top:11px;padding:10px 11px;border-radius:13px;background:#fff4e4;color:#6d4a12;font-size:13px;display:none}.tip.show{display:block;animation:rise .3s ease}.info-card{min-height:calc(100dvh - 195px);padding:24px 20px;background:linear-gradient(145deg,#fff 0%,#f6f8f8 100%)}.info-card h1{font-size:28px;margin:14px 0 16px}.info-body p{margin:0 0 14px}.info-body p:last-child{margin-bottom:0}.info-body strong{color:var(--ink)}@keyframes rise{from{opacity:0;transform:translateY(6px)}}@keyframes cardIn{from{opacity:.25;transform:translateX(12px)}to{opacity:1;transform:none}}
    .bottom-bar{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-top:1px solid #e3e7e8;backdrop-filter:blur(16px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}.controls{display:grid;grid-template-columns:48px minmax(116px,1fr);gap:8px}.btn{border:0;border-radius:15px;height:50px;font-weight:850;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}.btn:active{transform:scale(.97)}.back{background:#eef1f2;font-size:22px}.next{background:var(--red);color:#fff;font-size:15px;box-shadow:0 8px 20px rgba(233,29,45,.24)}.next.done{background:var(--ok)}
    .dots{display:flex;justify-content:center;gap:6px;margin:10px 0}.dot{width:7px;height:7px;border:0;padding:0;border-radius:99px;background:#ccd2d4;transition:.3s;cursor:pointer}.dot.active{width:22px;background:var(--red)}
    .sizes{width:100%;border-collapse:collapse;margin:10px 0}.sizes th,.sizes td{padding:10px 5px;border-bottom:1px solid #dce1e3;text-align:center;font-size:13px}.sizes th:first-child,.sizes td:first-child{text-align:left}
    .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
    @media (max-width:390px){.brand-copy{display:none}.bottom-bar{grid-template-columns:42px 1fr}}
    @media (max-height:700px){.stage{height:265px;min-height:225px}.step-card{min-height:0}.step-card h1{font-size:21px}.step-card p{font-size:14px;line-height:1.35}.photo-shell{inset:8px 12px 45px}.photo-frame{height:205px}.hint{padding:9px 12px}.dots{margin:8px 0}}
    @media (min-width:760px){body{padding:24px 0}.app{min-height:calc(100vh - 48px);border-radius:30px}.bottom-bar{bottom:24px;border-radius:0 0 30px 30px}.stage{height:330px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div class="app">
  <main>
    <div class="progress-row"><div class="progress" aria-label="Прогресс"><i></i></div><span class="count">1 / 9</span></div>
    <section class="stage" data-step="0" aria-label="Фотография текущего шага"><div class="photo-shell"><div class="photo-frame"><img class="step-photo" src="assets/step-1-hq.jpg" alt="Фотография первого шага"><i class="scanline"></i><span class="subcheck"></span><div class="test-tabs" aria-label="Этап проверки герметичности"><button class="test-tab active" data-test="0">1</button><button class="test-tab" data-test="1">2</button><button class="test-tab" data-test="2">3</button></div></div></div><div class="hint">Осмотрите маску со всех сторон</div></section>
    <div class="dots" aria-label="Выбор шага"></div>
    <section class="step-card" aria-live="polite"><div class="step-kicker"><b>1</b><span>Подготовка</span></div><h1>Проверьте полумаску</h1><p>Возьмите её в руки, осмотрите корпус, клапаны вдоха и выдоха. Установите подходящие сменные фильтры.</p><div class="tip"></div></section>
  </main>
  <footer class="bottom-bar">
    <div class="brand"><div class="logo">ВМ</div><div class="brand-copy"><div class="eyebrow">Безопасная работа</div><div class="title">Надевание полумаски</div></div></div>
    <div class="controls"><button class="btn back" aria-label="Предыдущий экран">‹</button><button class="btn next">Далее <span>→</span></button></div>
  </footer>
</div>
<script>
const slides=[
 {tag:'Подготовка',title:'Осмотрите полумаску',text:'Возьмите полумаску в руки и осмотрите её со всех сторон, включая клапаны вдоха и выдоха. Установите фильтры.',hint:'Осмотрите маску и установите фильтры',image:'assets/step-1-hq.jpg',tip:''},
 {tag:'Посадка',title:'Приложите ко рту и носу',text:'Комфортно разместите полумаску на переносице, затем натяните наголовник на темя.',hint:'Разместите на переносице и натяните наголовник',image:'assets/step-2-hq.jpg',tip:''},
 {tag:'Фиксация',title:'Застегните шейный замок',text:'Возьмите шейные пряжки резинок и, натянув их, застегните замок.',hint:'Застегните замок за шеей',image:'assets/step-3-hq.jpg',tip:''},
 {tag:'Регулировка',title:'Отрегулируйте оголовье',text:'Подтяните резинки оголовья до плотного прилегания полумаски.',hint:'Подтяните верхние резинки равномерно',image:'assets/step-4-hq.jpg',tip:''},
 {tag:'Регулировка',title:'Отрегулируйте шейную резинку',text:'Подтяните шейную резинку до плотного прилегания полумаски.',hint:'Подтяните шейную резинку',image:'assets/step-5-hq.jpg',tip:''},
 {tag:'Контроль',title:'Проверьте герметичность',text:'Сначала закройте ладонью клапан выдоха и плавно выдохните. Затем закройте ладонями или пальцами отверстия боковых фильтров и плавно вдохните.',hint:'Выполните обе проверки герметичности',image:'assets/step-6a-hq.jpg',tip:'Если воздух проходит между лицом и полумаской, отрегулируйте её и повторите проверку. Если герметичности достичь невозможно, покиньте опасную зону и замените полумаску.'},
 {kind:'info',tag:'Справка',title:'Проверка герметичности',body:'<p><strong>Отрицательное давление:</strong> закройте ладонями фильтры и плавно вдохните. Маска должна слегка прижаться к лицу без подсоса воздуха.</p><p><strong>Положительное давление:</strong> закройте клапан выдоха и плавно выдохните. Воздух не должен выходить между лицом и обтюратором.</p>'},
 {kind:'info',tag:'После работы',title:'Уход и хранение',body:'<p>Снимите фильтры. Протрите полумаску салфетками или вымойте нейтральным средством, затем промойте и полностью высушите.</p><p>Храните чистую полумаску в контейнере или герметичном пакете.</p>'},
 {kind:'info',tag:'Подбор',title:'Как выбрать размер',body:'<table class="sizes"><tr><th>Размер</th><th>S</th><th>M</th><th>L</th></tr><tr><td>Длина лица</td><td>94–114</td><td>104–124</td><td>114–141</td></tr><tr><td>Ширина лица</td><td>118–136</td><td>127–145</td><td>136–154</td></tr></table><small>Размеры указаны в миллиметрах.</small>'}
];
const testFrames=[{image:'assets/step-6a-hq.jpg',label:'Выдох',alt:'Проверка клапана выдоха ладонью'},{image:'assets/step-6b-hq.jpg',label:'Вдох',alt:'Проверка боковых фильтров ладонями'},{image:'assets/step-6c-hq.jpg',label:'Повтор',alt:'Повторная регулировка полумаски при утечке'}];
let current=0,testFrame=0,testTimer;
const stage=document.querySelector('.stage'),card=document.querySelector('.step-card'),bar=document.querySelector('.progress i'),count=document.querySelector('.count'),next=document.querySelector('.next'),back=document.querySelector('.back'),dots=document.querySelector('.dots'),photo=document.querySelector('.step-photo'),frame=document.querySelector('.photo-frame'),subcheck=document.querySelector('.subcheck'),testTabs=document.querySelector('.test-tabs');
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='dot';b.setAttribute('aria-label',(s.kind==='info'?'Справочный экран ':'Шаг ')+(i+1));b.onclick=()=>render(i);dots.appendChild(b)});
function setPhoto(src,alt){photo.src=src;photo.alt=alt;frame.classList.remove('animate');requestAnimationFrame(()=>frame.classList.add('animate'))}
function showTest(n,manual=false){testFrame=n%testFrames.length;const t=testFrames[testFrame];setPhoto(t.image,t.alt);subcheck.textContent=(testFrame+1)+' · '+t.label;[...testTabs.children].forEach((b,i)=>b.classList.toggle('active',i===testFrame));if(manual){clearInterval(testTimer);testTimer=setInterval(()=>showTest(testFrame+1),3200)}}
function render(i){
 clearInterval(testTimer);current=Math.max(0,Math.min(slides.length-1,i));const s=slides[current],isInfo=s.kind==='info';
 stage.classList.toggle('hidden',isInfo);card.classList.toggle('info-card',isInfo);card.classList.remove('slide-in');requestAnimationFrame(()=>card.classList.add('slide-in'));
 card.querySelector('b').textContent=current+1;card.querySelector('.step-kicker span').textContent=s.tag;card.querySelector('h1').textContent=s.title;
 const bodyText=card.querySelector('p'),tip=card.querySelector('.tip');let info=card.querySelector('.info-body');
 if(!info){info=document.createElement('div');info.className='info-body';card.insertBefore(info,tip)}
 bodyText.hidden=isInfo;info.hidden=!isInfo;info.innerHTML=isInfo?s.body:'';if(!isInfo)bodyText.textContent=s.text;tip.textContent=!isInfo&&s.tip?'Важно: '+s.tip:'';tip.classList.toggle('show',!isInfo&&!!s.tip);
 bar.style.width=((current+1)/slides.length*100)+'%';count.textContent=(current+1)+' / '+slides.length;back.disabled=current===0;back.style.opacity=current===0?'.35':'1';next.classList.toggle('done',current===slides.length-1);next.innerHTML=current===slides.length-1?'Готово ✓':'Далее <span>→</span>';[...dots.children].forEach((d,n)=>d.classList.toggle('active',n===current));
 if(isInfo)return;stage.dataset.step=current;stage.querySelector('.hint').textContent=s.hint;const isTest=current===5;testTabs.classList.toggle('show',isTest);subcheck.classList.toggle('show',isTest);if(isTest){showTest(0);testTimer=setInterval(()=>showTest(testFrame+1),3200)}else setPhoto(s.image,'Фотография шага '+(current+1))
}
document.querySelectorAll('.test-tab').forEach(b=>b.onclick=e=>{e.stopPropagation();showTest(Number(b.dataset.test),true)});
back.onclick=()=>render(current-1);next.onclick=()=>current===slides.length-1?render(0):render(current+1);
slides.filter(s=>s.image).map(s=>s.image).concat(testFrames.map(t=>t.image)).forEach(src=>{const img=new Image();img.src=src});
let touchX=0,touchY=0;document.querySelector('main').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});document.querySelector('main').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))render(current+(dx<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')render(current+1);if(e.key==='ArrowLeft')render(current-1)});render(0);
</script>
</body>
</html>
